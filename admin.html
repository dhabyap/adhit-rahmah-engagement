<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP Dashboard — Rahmah &amp; Adhit</title>
<meta property="og:title" content="RSVP Dashboard">
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#4A4036; --moss:#6F7C4E; --ivory:#FBF6EC; --gold:#C9A24B;
  --pink:#F2B5A7; --peach:#F8D8C0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#efe3d3; color:var(--ink);
  font:300 .95rem/1.75 "Jost",system-ui,sans-serif;
  padding:48px 20px;
}
.wrap{max-width:820px;margin:0 auto;background:var(--ivory);padding:48px 36px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font:400 1.9rem/1.15 "Cormorant Garamond",Georgia,serif;color:var(--moss);letter-spacing:.06em;margin-bottom:8px}
h2{font:400 1.4rem "Cormorant Garamond",Georgia,serif;color:var(--moss);margin:26px 0 10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.row div{border:1px solid var(--gold);padding:14px;text-align:center;background:#fff}
.row b{display:block;font:500 1.7rem/1.1 "Cormorant Garamond",serif;color:var(--moss)}
.row span{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#8a7d6e}
.btn{padding:10px 18px;background:var(--moss);color:var(--ivory);border:none;font:400 .75rem "Jost",sans-serif;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;margin-right:8px}
.btn.ghost{background:transparent;color:var(--moss);border:1px solid var(--moss)}
.hint{font-size:.8rem;color:#8a7d6e;margin-top:8px}
.err{background:#FCECE8;border:1px solid #a4473a;color:#6a2418;padding:10px 14px;margin-top:14px;display:none}
.err.show{display:block}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.85rem}
th,td{padding:8px 10px;border-bottom:1px solid rgba(201,162,75,.25);text-align:left}
th{font-weight:600;color:var(--moss);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase}
td.num{text-align:center}
.badge{display:inline-block;padding:2px 8px;font-size:.7rem;border-radius:10px;background:var(--peach);color:#8a6b3a}
.badge.yes{background:#dcebdc;color:#2f5232}
.badge.no{background:#f5d9d5;color:#7a2e3f}
.empty{text-align:center;padding:48px;color:#8a7d6e;font-style:italic}
@media(max-width:560px){
  .wrap{padding:24px 18px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>RSVP Dashboard</h1>
  <p class="hint">Rahmah &amp; Adhit — 15 November 2026</p>
  <div class="err" id="err"></div>
  <p class="hint" id="lastUpd"></p>

  <div class="row">
    <div><b id="sAtt">—</b><span>Hadir</span></div>
    <div><b id="sNo">—</b><span>Tidak hadir</span></div>
    <div><b id="sGuests">—</b><span>Total tamu</span></div>
  </div>

  <h2>Daftar tamu</h2>
  <div id="table"></div>

  <div style="margin-top:26px">
    <button class="btn" id="reload">Refresh</button>
    <button class="btn ghost" id="csv">Export CSV</button>
  </div>
</div>

<script>
// Ganti API dengan URL Apps Script kamu setelah deploy.
// Buka admin.html?key=RA-ADMIT-2026&auto=1 untuk auto-refresh tiap 30 detik.
const API = "https://script.google.com/macros/s/AKfycbyqogpnjESR9_R3ANhUjBVKhb-ZYbeds_IpHs8Z_r7fDeA7OgF1VOUAPXd-hYDVdmBl/exec";
const KEY = new URLSearchParams(location.search).get("key") || "RA-ADMIT-2026";
const AUTO = new URLSearchParams(location.search).has("auto");

function showErr(m){ const e=document.getElementById('err'); e.textContent=m; e.classList.add('show'); }

async function load(){
  showErr("");
  const r = await fetch(`${API}?key=${KEY}`);
  const j = await r.json();
  if (!j.ok) { showErr(j.error || "Gagal ambil data"); return; }
  document.getElementById('lastUpd').textContent = 'Diperbarui: ' + new Date().toLocaleString('id');
  const rows = j.rows;

  // Statistik
  const hadir = rows.filter(r=>r.hadir);
  const total = rows.reduce((s,r)=>s+(r.jumlah||0),0);
  document.getElementById('sAtt').textContent = hadir.length;
  document.getElementById('sNo').textContent = rows.length - hadir.length;
  document.getElementById('sGuests').textContent = total;

  // Tabel
  if (!rows.length) {
    document.getElementById('table').innerHTML = '<p class="empty">Belum ada konfirmasi.</p>';
    return;
  }
  const th = `<tr><th>#</th><th>Nama</th><th>Hadir?</th><th class="num">Jumlah</th><th>HP</th><th>Ucapan</th><th>Waktu</th></tr>`;
  const tr = rows.map((r,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${escapeHtml(r.nama)}</td>
      <td><span class="badge ${r.hadir?'yes':'no'}">${r.hadir?'Hadir':'Tidak'}</span></td>
      <td class="num">${r.jumlah||0}</td>
      <td>${escapeHtml(r.hp||"—")}</td>
      <td>${escapeHtml(r.ucapan||"")}</td>
      <td>${escapeHtml(r.waktu||"")}</td>
    </tr>`).join("");
  document.getElementById('table').innerHTML = `<table>${th}${tr}</table>`;

  // Simpan untuk CSV
  window._rows = rows;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

document.getElementById('reload').onclick = load;
if (AUTO) setInterval(load, 30000);
document.getElementById('csv').onclick = () => {
  if (!window._rows || !window._rows.length) return showErr("Belum ada data untuk di-ekspor.");
  const head = ["Nama","Hadir","Jumlah","HP","Ucapan","Waktu"];
  const csv = [head.join(";"), ...window._rows.map(r=>[
    r.nama, r.hadir?"Hadir":"Tidak", r.jumlah, r.hp,
    '"'+(r.ucapan||"").replace(/"/g,'""')+'"', r.waktu
  ].join(";"))].join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "rsvp-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
};
load();
</script>
</body>
</html>
